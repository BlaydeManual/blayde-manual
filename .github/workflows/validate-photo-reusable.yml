name: Validate contributed photo (reusable)

# Called by every vehicle repo's own validate-photo.yml, which is just
# a one-line wrapper (`uses: BlaydeManual/blayde-manual/.github/workflows/
# validate-photo-reusable.yml@v1`) -- see ROADMAP.md's "one checker,
# one place" entry for why. Before this, checker.py (and this whole
# workflow) was copied into every vehicle repo individually, with no
# sync mechanism at all -- fixing a real bug (2026-09-11, the flat
# resolution floor) meant hand-pushing the same change to four separate
# repos. Now a fix lands here once; every repo referencing the same
# pinned tag picks it up on its next PR, no per-repo change needed.
#
# checker.py itself is fetched below from THIS repo, pinned to the
# exact same ref the caller referenced -- never a different ref, so the
# workflow logic and the script it runs can't silently drift apart from
# each other, only ever move together when a caller updates its own
# pinned tag.

on:
  workflow_call: {}

jobs:
  checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Real, confirmed bug this closes, 2026-09-02: triggering only on
      # a path filter meant this job never ran at all for a PR that
      # didn't touch images/ -- a manifest-only PR, for instance.
      # Branch protection requires this job's real status on EVERY PR,
      # but a job that never runs never posts one, and GitHub blocks
      # merge indefinitely for a required check with no status at all,
      # not just a failing one. Triggering on every PR and
      # skipping-with-success here, instead of relying on the trigger to
      # filter, means this job always posts a real status regardless of
      # what the PR touches.
      - name: Check whether this PR touches any edition's images/
        id: relevant
        run: |
          git diff --name-only origin/${{ github.base_ref }}...HEAD > all_changed_files.txt
          if grep -qE '^[^/]+/images/' all_changed_files.txt; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "No changes under any edition's images/ -- nothing for this check to validate."
          fi

      # Real gap this closes: a PR could ride a second, unrelated change
      # in alongside an innocent-looking photo -- the severe case being
      # a modified .github/workflows/*.yml, which merged into this repo
      # means real code execution here, not just a bad photo. Also
      # enforces every changed file lives under the SAME edition folder
      # -- a photo isn't reviewable against a manifest.json if the PR
      # doesn't say which one it's for, and mixing two editions' photos
      # in one PR is exactly as unreviewable as mixing two vehicles'
      # would be. Runs before any Python setup, so a PR that fails this
      # never spends CI time on a checker run it was never going to pass
      # anyway.
      - name: Enforce PR touches only one edition's images/
        if: steps.relevant.outputs.relevant == 'true'
        run: |
          git diff --name-only origin/${{ github.base_ref }}...HEAD > all_changed_files.txt
          OUTSIDE=$(grep -Ev '^[^/]+/images/' all_changed_files.txt || true)
          if [ -n "$OUTSIDE" ]; then
            echo "This PR changes files outside <edition>/images/, not just a contributed photo:"
            echo "$OUTSIDE"
            echo ""
            echo "Only a photo under some edition's images/ folder is accepted here. Please open a separate PR for anything else."
            exit 1
          fi
          EDITIONS=$(cut -d/ -f1 all_changed_files.txt | sort -u)
          EDITION_COUNT=$(echo "$EDITIONS" | wc -l)
          if [ "$EDITION_COUNT" -gt 1 ]; then
            echo "This PR touches more than one edition's images/ folder:"
            echo "$EDITIONS"
            echo ""
            echo "A photo belongs to exactly one edition's manifest.json -- please split this into separate PRs, one edition each."
            exit 1
          fi
          echo "OK -- every changed file is under $EDITIONS/images/"
          echo "edition=$EDITIONS" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        if: steps.relevant.outputs.relevant == 'true'
        with:
          python-version: "3.11"

      - name: Install checker dependencies
        if: steps.relevant.outputs.relevant == 'true'
        run: pip install pillow numpy

      - name: Find changed photos
        if: steps.relevant.outputs.relevant == 'true'
        id: changed
        run: |
          cp all_changed_files.txt changed_files.txt
          cat changed_files.txt

      # Exactly one file, full stop -- not "one procedure_id, any number
      # of files", which contribute.html's own upload input can never
      # actually produce anyway (no `multiple` attribute -- confirmed,
      # the real site only ever submits one photo per PR). There's also
      # no real mechanism anywhere downstream (patcher.js, review-panel.js)
      # to choose among several alt-angle photos landing in one PR, so
      # allowing that here would only let an ambiguous state in that
      # nothing can resolve. auth-worker's own /accept-photo-pr gate
      # enforces this exact same rule independently at merge time.
      - name: Enforce exactly one photo per PR
        if: steps.relevant.outputs.relevant == 'true'
        run: |
          python - <<'EOF'
          from pathlib import Path

          files = [l.strip() for l in open("changed_files.txt") if l.strip()]
          if not files:
              print("No image files changed -- nothing to validate.")
              raise SystemExit(0)
          if len(files) > 1:
              print(f"This PR touches {len(files)} photo files, not 1:")
              for f in sorted(files):
                  print(f"  - {f}")
              print("\nOnly one photo per pull request is accepted -- please split this "
                    "into separate PRs, one photo each.")
              raise SystemExit(1)
          print(f"OK -- single photo: {files[0]}")
          EOF

      # Resolves which ref of THIS repo to pull the shared checker.py
      # from -- always the exact ref the caller's own `uses:` line
      # pinned (a tag like v1, a specific commit, whatever). Real
      # near-miss caught in testing: `github.workflow_ref` (and its
      # GITHUB_WORKFLOW_REF env var) is the CALLER's own ref, not this
      # reusable workflow's -- confirmed against GitHub's own context
      # docs after a first draft used that one and would have tried to
      # fetch checker.py from every calling vehicle repo's own ref
      # instead, breaking on the very first real call. `job.workflow_ref`
      # is the one that's actually scoped to "the ref of the workflow
      # file that defines the CURRENT job," which for a job defined
      # inside a reusable workflow means this file's own ref -- exactly
      # what's needed here, but it's a job-context property, not an
      # auto-exposed env var, so it's threaded through explicitly below
      # rather than interpolated directly into the script. Handles all
      # three real ref shapes (refs/heads/x, refs/tags/x, or a bare
      # commit SHA with neither prefix -- the # substitutions are no-ops
      # when a prefix doesn't match, so a SHA passes through untouched).
      - name: Resolve shared-checker ref
        if: steps.relevant.outputs.relevant == 'true'
        id: shared-ref
        env:
          JOB_WORKFLOW_REF: ${{ job.workflow_ref }}
        run: |
          REF="${JOB_WORKFLOW_REF#*@}"
          REF="${REF#refs/heads/}"
          REF="${REF#refs/tags/}"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Check out shared checker.py
        if: steps.relevant.outputs.relevant == 'true'
        uses: actions/checkout@v4
        with:
          repository: BlaydeManual/blayde-manual
          ref: ${{ steps.shared-ref.outputs.ref }}
          path: _shared-checker
          sparse-checkout: |
            scaffold/checker.py
          sparse-checkout-cone-mode: false

      - name: Run checker.py against changed photo
        if: steps.relevant.outputs.relevant == 'true'
        run: |
          FILES=$(cat changed_files.txt)
          if [ -z "$FILES" ]; then
            echo "No image files to check."
            exit 0
          fi
          # Manifest lives one level up from images/, under the same
          # edition folder as the photo itself -- never the repo root,
          # since a bbox is only meaningful against its own edition's
          # coordinate space.
          python _shared-checker/scaffold/checker.py $FILES --manifest "${edition}/manifest.json"
          # checker.py exits non-zero on any hard-fail -- that's what fails this step.
