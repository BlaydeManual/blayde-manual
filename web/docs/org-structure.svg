  <text x="180" y="279" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#c8102e">onboarding approved by: K + S</text>
</g>

<g>
  <rect x="330" y="186" width="240" height="102" rx="8" fill="#ffffff" stroke="#4a4f57" stroke-width="1.5"/>
