<svg width="900" height="700" viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Blayde Manual org structure, approvals, and photo ownership</title>
<desc>Five org maintainers exist as a pool; any two of them approve a new vehicle joining the registry, and different pairs approve different vehicles. Once a vehicle repo exists, it has its own separate pool of maintainers who approve that vehicle's own photo contributions, using the same two-approval rule -- and each vehicle's maintainer pool is its own size, not a fixed number. A vehicle can have more than one manual edition, each fully independent. Every contributed photo stays copyrighted by its contributor, licensed CC-BY 4.0, no matter which repo holds a copy of it.</desc>

<rect x="0" y="0" width="900" height="700" fill="#ffffff"/>

<!-- org band -->
<rect x="40" y="16" width="820" height="124" rx="10" fill="#0c0d0f"/>
<text x="450" y="46" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">BLAYDE MANUAL <tspan fill="#c8102e">// ORG</tspan></text>
<text x="450" y="66" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#b9bec6">5 org maintainers, as a pool — any 2 of them approve a new vehicle joining the registry</text>

<g font-family="Helvetica, Arial, sans-serif">
  <circle cx="330" cy="106" r="13" fill="#4a4f57"/>
  <text x="330" y="110" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">K</text>
  <circle cx="390" cy="106" r="13" fill="#4a4f57"/>
  <text x="390" y="110" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">D</text>
  <circle cx="450" cy="106" r="13" fill="#4a4f57"/>
  <text x="450" y="110" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">S</text>
  <circle cx="510" cy="106" r="13" fill="#4a4f57"/>
  <text x="510" y="110" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">L</text>
  <circle cx="570" cy="106" r="13" fill="#4a4f57"/>
  <text x="570" y="110" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">M</text>
</g>
<text x="450" y="130" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#8a8f98">K=@wrench_kate  D=@torque_dave  S=@sv_steve  L=@admin_lena  M=@caretaker_mo</text>

<!-- connectors org -> vehicles -->
<line x1="180" y1="140" x2="180" y2="186" stroke="#8a8f98" stroke-width="1.5"/>
<line x1="450" y1="140" x2="450" y2="186" stroke="#8a8f98" stroke-width="1.5"/>
<line x1="720" y1="140" x2="720" y2="186" stroke="#8a8f98" stroke-width="1.5"/>

<!-- Suzuki: stacked-card look, showing multiple manual editions -->
<rect x="68" y="194" width="240" height="102" rx="8" fill="#ffffff" stroke="#b4b2a9" stroke-width="1"/>
<g>
  <rect x="60" y="186" width="240" height="102" rx="8" fill="#ffffff" stroke="#4a4f57" stroke-width="1.5"/>
