<!-- ownership banner -->
<line x1="180" y1="472" x2="180" y2="510" stroke="#8a8f98" stroke-width="1.5" stroke-dasharray="3 3"/>
<line x1="450" y1="472" x2="450" y2="510" stroke="#8a8f98" stroke-width="1.5" stroke-dasharray="3 3"/>
<line x1="720" y1="472" x2="720" y2="510" stroke="#8a8f98" stroke-width="1.5" stroke-dasharray="3 3"/>

<rect x="60" y="510" width="780" height="130" rx="10" fill="#fcebeb" stroke="#c8102e" stroke-width="1.5"/>
<text x="450" y="542" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#791f1f">You always keep the copyright on your own photo</text>
<text x="450" y="570" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#501313">
  Every repo above just holds a licensed copy (CC-BY 4.0, credit required, nothing exclusive).
</text>
<text x="450" y="590" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#501313">
  Ownership never transfers to the vehicle repo, the org, or anyone else (not when it's forked,
</text>
<text x="450" y="610" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#501313">
  not when a vehicle's repo moves into the org, not ever). It's still yours, wherever a copy lives.
</text>

<!-- clean space below the banner, no lines crossing here -->
<text x="450" y="662" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#8a8f98">Different pairs, no fixed committee — the org pool never bottlenecks on the same 2 people. Each vehicle's maintainer pool is its own size, too.</text>
<text x="450" y="682" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#8a8f98">A vehicle can have more than one manual edition (OEM, Haynes, Chilton…), each fully independent. See CONTRIBUTING.md and LICENSE.md.</text>
</svg>
