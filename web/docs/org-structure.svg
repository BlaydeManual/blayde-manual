  <rect x="234" y="194" width="66" height="18" rx="9" fill="#c8102e"/>
  <text x="267" y="207" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#ffffff">2 EDITIONS</text>
  <text x="180" y="226" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0c0d0f">Suzuki SV650</text>
  <text x="180" y="244" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5f5e5a">OEM manual · Haynes manual</text>
