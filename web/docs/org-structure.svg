  <rect x="600" y="186" width="240" height="6" rx="3" fill="#c8102e"/>
  <text x="720" y="218" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0c0d0f">Datsun 620 repo</text>
  <text x="720" y="238" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5f5e5a">dedicated maintainers</text>
  <text x="720" y="255" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5f5e5a">dedicated contributors, own pace</text>
  <text x="720" y="279" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#c8102e">onboarding approved by: M + K</text>
</g>

<!-- connectors vehicle -> images: kept clear of any label text -->
<line x1="180" y1="296" x2="180" y2="336" stroke="#8a8f98" stroke-width="1.5"/>
<line x1="450" y1="288" x2="450" y2="336" stroke="#8a8f98" stroke-width="1.5"/>
<line x1="720" y1="288" x2="720" y2="336" stroke="#8a8f98" stroke-width="1.5"/>

