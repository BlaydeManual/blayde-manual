<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Signing in - Blayde Manual</title>
<style>
  :root { --red: #c8102e; --black: #0c0d0f; --black-2: #16181c; --steel: #8a8f98; --steel-dark: #666c76; --text: #e8e8ea; }
  * { box-sizing: border-box; }
  html, body {
    height: 100%; margin: 0; background: var(--black); color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center;
  }
  .card {
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    text-align: center; padding: 32px;
  }
  .spinner {
    width: 28px; height: 28px; border-radius: 50%;
    border: 3px solid var(--steel-dark); border-top-color: var(--red);
    animation: spin 0.8s linear infinite;
  }
  .spinner.done { display: none; }
  .checkmark { display: none; font-size: 28px; line-height: 1; color: #1d9e75; }
  .checkmark.show { display: block; }
  .error-mark { display: none; font-size: 28px; line-height: 1; color: var(--red); }
  .error-mark.show { display: block; }
  @keyframes spin { to { transform: rotate(360deg); } }
  p { margin: 0; color: var(--steel); font-size: 0.9rem; }
  p.message-error { color: var(--red); }
</style>
</head>
<body>
<div class="card">
  <div class="spinner" id="spinner"></div>
  <div class="checkmark" id="checkmark">&#10003;</div>
  <div class="error-mark" id="errorMark">&#10005;</div>
  <p id="statusText">Signing in&hellip;</p>
</div>
<script>
(async function () {
  const HANDOFF_KEY = "blayde_auth_handoff_v1";
  const params = new URLSearchParams(location.search);
  const code = params.get("code");
  const state = params.get("state");
  const expectedState = sessionStorage.getItem("blayde_oauth_state_v1");

  // Primary handoff: localStorage, picked up by the opener's "storage"
  // listener (auth.js). Doesn't depend on window.opener surviving the
  // round trip through github.com, which some browsers sever even on a
  // same-origin landing. postMessage is a secondary attempt only.
  function done(payload) {
    const full = { state, ...payload };
    try { localStorage.setItem(HANDOFF_KEY, JSON.stringify(full)); } catch (e) { /* storage unavailable */ }
    if (window.opener) {
      try { window.opener.postMessage({ source: "blayde-auth-callback", ...full }, window.location.origin); } catch (e) { /* opener gone or cross-origin */ }
    }
    document.getElementById("spinner").classList.add("done");
    const statusText = document.getElementById("statusText");
    if (payload.error) {
      document.getElementById("errorMark").classList.add("show");
      statusText.textContent = `Sign-in failed: ${payload.error}`;
      statusText.classList.add("message-error");
    } else {
      document.getElementById("checkmark").classList.add("show");
      statusText.textContent = "Signed in. You can close this window.";
    }
    // Give the opener a moment to pick up the handoff and close this
    // window itself; if it's still open after that (opener reference
    // lost), close it from here instead.
    setTimeout(() => { try { window.close(); } catch (e) {} }, 1500);
  }

  if (params.get("error")) {
    done({ error: params.get("error_description") || params.get("error") });
    return;
  }
  if (!code || !state || state !== expectedState) {
    done({ error: "Sign-in state mismatch -- please try again." });
    return;
  }

  // state carries "oauth:<uuid>" or "githubapp:<uuid>" -- the only value
  // GitHub round-trips unmodified through the redirect, so it's what
  // tells this callback which Worker endpoint to exchange against and
  // which authType the resulting session should be tagged with. See
  // web/auth.js's startSignIn/signInWithGitHubApp for the other end of
  // this.
  const authType = state.startsWith("githubapp:") ? "githubapp" : "oauth";
  const exchangeUrl = authType === "githubapp" ? "https://auth.blaydemanual.com/app-token" : "https://auth.blaydemanual.com/";

  try {
    const exchangeResp = await fetch(exchangeUrl, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ code }),
    });
    const exchangeData = await exchangeResp.json();
    if (!exchangeResp.ok || exchangeData.error) {
      done({ error: exchangeData.error || "Token exchange failed." });
      return;
    }

    const userResp = await fetch("https://api.github.com/user", {
      headers: { Authorization: `Bearer ${exchangeData.access_token}` },
    });
    const userData = await userResp.json();
    done({ token: exchangeData.access_token, username: userData.login, authType });
  } catch (err) {
    done({ error: "Network error during sign-in." });
  }
})();
</script>
</body>
</html>
